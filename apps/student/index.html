<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preload" as="image" href="/pwa-192.png" fetchpriority="high" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#192f59" />
    <meta name="description" content="TASFUED LMS — classes, recordings, course text, assignments, quizzes and forum." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" /></noscript>
    <style>
      body { margin: 0; }
      .boot-screen {
        align-items: center;
        background: #f7f8fa;
        color: #192f59;
        display: flex;
        flex-direction: column;
        gap: 18px;
        justify-content: center;
        min-height: 100vh;
      }
      .boot-wordmark {
        font-family: Manrope, "Trebuchet MS", sans-serif;
        font-size: 20px;
        font-weight: 800;
      }
      .boot-logo {
        display: block;
        height: 88px;
        object-fit: contain;
        width: 88px;
      }
      .boot-wordmark span {
        color: #bf7c09;
      }
      .boot-progress {
        background: #dbe2eb;
        height: 3px;
        overflow: hidden;
        width: min(180px, 55vw);
      }
      .boot-progress span {
        animation: boot-progress 1.3s ease-in-out infinite;
        background: #2f7d46;
        display: block;
        height: 100%;
        width: 40%;
      }
      .boot-screen p {
        color: #5f6672;
        font-size: 14px;
        margin: 0;
      }
      .boot-retry {
        background: #192f59;
        border: 0;
        border-radius: 4px;
        color: white;
        cursor: pointer;
        font: inherit;
        padding: 10px 16px;
      }
      @keyframes boot-progress {
        from { transform: translateX(-110%); }
        to { transform: translateX(260%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-progress span {
          animation: none;
          width: 60%;
        }
      }
    </style>
    <title>TASFUED LMS</title>
  </head>
  <body>
    <div id="root">
      <main class="boot-screen" role="status" aria-live="polite">
        <img class="boot-logo" src="/pwa-192.png" alt="TASFUED crest" width="88" height="88" fetchpriority="high" />
        <div class="boot-wordmark">TASFUED <span>LMS</span></div>
        <div class="boot-progress" aria-hidden="true"><span></span></div>
        <p>Preparing your learning space...</p>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
